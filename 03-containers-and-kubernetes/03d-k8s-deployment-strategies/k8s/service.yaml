# HW3_C Task 1 — Service (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: embedder
  namespace: qbc12-hw03-c-melika-nobakhtian
  labels: {app: embedder}
spec:
  type: NodePort
  selector:
    app: embedder                 
  ports:
  - name: http
    port: 80                      
    targetPort: http              
    nodePort: 30122  
    protocol: TCP